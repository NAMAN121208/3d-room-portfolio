<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 8: Props Integration Preview</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0a0d14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #e2e8f0;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      max-width: 420px;
      pointer-events: auto;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    #hud h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #hud .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }
    #hud p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
    }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-prop { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
    .badge-room { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.5); }

    #tooltip {
      position: absolute;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      pointer-events: none;
      transform: translate(-50%, -125%);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      z-index: 100;
      white-space: nowrap;
    }
    #tooltip .title {
      font-weight: 700;
      color: #f8fafc;
      font-size: 13px;
    }
    #tooltip .detail {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <h2><span class="status-dot"></span> Phase 8: Props Integration</h2>
    <p>Room with loaded prop models: Sketchbook, Headphones, Football cleats, and Jersey.</p>
    <div id="props-list" style="font-size:11px; font-family:monospace; color:#cbd5e1; display:flex; flex-direction:column; gap:4px;">
      <div>• Sketchbook: On desk [1.4, 1.25, -2.1]</div>
      <div>• Headphones: On desk [-0.15, 1.25, -2.0]</div>
      <div>• Football: On floor near door [1.95, 0.20, -2.4]</div>
      <div>• Jersey: Framed on wall [2.4, 2.4, -2.9]</div>
    </div>
  </div>

  <div id="tooltip">
    <div class="title" id="tt-title">Object Name</div>
    <div class="detail" id="tt-detail"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttDetail = document.getElementById('tt-detail');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0a0d14');

    const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
    // Isometric angle
    camera.position.set(8.5, 7.0, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting matching Lights.jsx
    const ambientLight = new THREE.AmbientLight('#fff7ed', 0.95);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight('#e0e7ff', '#78350f', 0.45);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight('#fffbeb', 1.8);
    keyLight.position.set(10, 15, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0002;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight('#c7d2fe', 0.6);
    fillLight.position.set(-8, 7, -6);
    scene.add(fillLight);

    const accentLight = new THREE.PointLight('#f59e0b', 1.2, 8.5, 2);
    accentLight.position.set(-0.5, 2.8, -2.4);
    scene.add(accentLight);

    const loader = new GLTFLoader();
    const allMeshes = [];

    function setupMeshes(rootObj, groupName, isProp = false) {
      rootObj.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData.groupName = groupName;
          child.userData.isProp = isProp;
          allMeshes.push(child);
        }
      });
    }

    // 1. Room model
    loader.load('/models/room.glb', (gltf) => {
      scene.add(gltf.scene);
      setupMeshes(gltf.scene, 'Room');
      console.log('Room loaded');
    });

    // 2. Sketchbook: on desk at [1.4, 1.25, -2.1]
    loader.load('/models/props/sketchbook.glb', (gltf) => {
      const group = new THREE.Group();
      group.name = 'Sketchbook';
      group.position.set(1.4, 1.25, -2.1);
      group.rotation.set(0, -0.25, 0);

      // Offset and scale so bottom sits flush at y=0, centered in X and Z
      const model = gltf.scene;
      model.scale.set(0.00055, 0.00055, 0.00055);
      model.position.set(0.042, 0.003, -0.166);

      group.add(model);
      scene.add(group);
      setupMeshes(group, 'Sketchbook', true);
      console.log('Sketchbook loaded');
    });

    // 3. Headphones: on desk at [-0.15, 1.25, -2.0]
    loader.load('/models/props/headphones.glb', (gltf) => {
      const group = new THREE.Group();
      group.name = 'Headphones';
      group.position.set(-0.15, 1.25, -2.0);
      group.rotation.set(0, 0.5, 0);

      const model = gltf.scene;
      model.scale.set(0.025, 0.025, 0.025);
      model.position.set(0, 0.114, 0);

      group.add(model);
      scene.add(group);
      setupMeshes(group, 'Headphones', true);
      console.log('Headphones loaded');
    });

    // 4. Football cleats: on floor near door at [1.95, 0.20, -2.4]
    loader.load('/models/props/football.glb', (gltf) => {
      const group = new THREE.Group();
      group.name = 'Football';
      group.position.set(1.95, 0.20, -2.4);
      group.rotation.set(0, -0.6, 0);

      const model = gltf.scene;
      model.scale.set(1.1, 1.1, 1.1);
      // Center and sit flush on floor
      model.position.set(0.03, 0.023, -0.078);

      group.add(model);
      scene.add(group);
      setupMeshes(group, 'Football', true);
      console.log('Football cleats loaded');
    });

    // 5. Jersey: framed on wall at [2.4, 2.4, -2.9]
    loader.load('/models/props/jersey.glb', (gltf) => {
      const group = new THREE.Group();
      group.name = 'Jersey';
      group.position.set(2.4, 2.4, -2.9);
      group.rotation.set(0, 0, 0);

      const model = gltf.scene;
      model.scale.set(0.85, 0.85, 0.85);
      group.add(model);
      scene.add(group);
      setupMeshes(group, 'Jersey', true);
      console.log('Jersey loaded');
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(allMeshes);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const gName = hit.userData.groupName || hit.name;
        const isProp = hit.userData.isProp;

        ttTitle.textContent = `${gName}`;
        ttDetail.innerHTML = `<span class="badge ${isProp ? 'badge-prop' : 'badge-room'}">${isProp ? 'Interactive Prop' : 'Room Geometry'}</span> <span style="color:#94a3b8;font-size:11px;">Mesh: ${hit.name}</span>`;
        tooltip.style.display = 'block';
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top = e.clientY + 'px';
        document.body.style.cursor = 'pointer';
      } else {
        tooltip.style.display = 'none';
        document.body.style.cursor = 'default';
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
