<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Props Placement & Camera Framing Preview</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0a0d14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #e2e8f0;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      max-width: 440px;
      pointer-events: auto;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    #hud h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }
    #hud p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover, .btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <h2><span class="status-dot"></span> Props Placement & Framing</h2>
    <p>Calibrated placements on desk, coffee table, and floor. Switch views below:</p>
    <div class="btn-group">
      <a class="btn" id="btn-iso" href="?view=iso">Isometric Overview</a>
      <a class="btn" id="btn-hp" href="?view=hp">Headphones Close-up</a>
      <a class="btn" id="btn-sb" href="?view=sb">Sketchbook Close-up</a>
      <a class="btn" id="btn-fb" href="?view=fb">Football Close-up</a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0a0d14');

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Camera views matching content.js
    const views = {
      iso: { pos: [8.5, 7.0, 8.5], target: [0, 1.2, 0] },
      hp: { pos: [-1.10, 2.35, -0.30], target: [-2.60, 1.48, -1.90] },
      sb: { pos: [2.20, 2.35, 2.90], target: [0.60, 0.58, 1.30] },
      fb: { pos: [3.70, 1.90, -0.60], target: [2.02, 0.32, -2.28] }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const viewParam = urlParams.get('view') || 'iso';
    const activeView = views[viewParam] || views.iso;

    camera.position.set(...activeView.pos);
    camera.lookAt(...activeView.target);

    const activeBtn = document.getElementById(`btn-${viewParam}`);
    if (activeBtn) activeBtn.classList.add('active');

    // Lighting matching Lights.jsx
    const ambientLight = new THREE.AmbientLight('#fff7ed', 0.95);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight('#e0e7ff', '#78350f', 0.45);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight('#fffbeb', 1.8);
    keyLight.position.set(10, 15, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0002;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight('#c7d2fe', 0.6);
    fillLight.position.set(-8, 7, -6);
    scene.add(fillLight);

    const accentLight = new THREE.PointLight('#f59e0b', 1.2, 8.5, 2);
    accentLight.position.set(-0.5, 2.8, -2.4);
    scene.add(accentLight);

    // Procedural Football Texture
    function createFootballTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, 512, 256);

      ctx.fillStyle = '#0f172a';
      const patches = [
        [128, 64], [384, 64], [256, 128], [128, 192], [384, 192],
        [0, 128], [512, 128]
      ];

      for (const [x, y] of patches) {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
          const px = x + 24 * Math.cos(angle);
          const py = y + 24 * Math.sin(angle);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    const loader = new GLTFLoader();

    function setupShadows(obj) {
      obj.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
    }

    let loadedCount = 0;
    function checkAllLoaded() {
      loadedCount++;
      renderer.render(scene, camera);
      if (loadedCount >= 4) {
        console.log('All models loaded and rendered.');
        window.__ALL_LOADED__ = true;
      }
    }

    // 1. Room
    loader.load('/models/room.glb', (gltf) => {
      scene.add(gltf.scene);
      setupShadows(gltf.scene);
      checkAllLoaded();
    });

    // 2. Headphones on Stand
    loader.load('/models/props/headphones.glb', (gltf) => {
      const group = new THREE.Group();
      group.name = 'Headphones';
      group.position.set(-2.60, 1.24, -1.90);
      group.rotation.set(0, 0.65, 0);

      const baseGeo = new THREE.CylinderGeometry(0.08, 0.085, 0.015, 24);
      const standMat = new THREE.MeshStandardMaterial({ color: '#27272a', metalness: 0.8, roughness: 0.25 });
      const baseMesh = new THREE.Mesh(baseGeo, standMat);
      baseMesh.position.set(0, 0.0075, 0);
      baseMesh.castShadow = true;
      baseMesh.receiveShadow = true;
      group.add(baseMesh);

      const stemGeo = new THREE.CylinderGeometry(0.009, 0.009, 0.44, 16);
      const stemMesh = new THREE.Mesh(stemGeo, standMat);
      stemMesh.position.set(0, 0.23, 0);
      stemMesh.castShadow = true;
      group.add(stemMesh);

      const cradleGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.12, 16);
      const cradleMesh = new THREE.Mesh(cradleGeo, standMat);
      cradleMesh.rotation.set(0, 0, Math.PI / 2);
      cradleMesh.position.set(0, 0.45, 0);
      cradleMesh.castShadow = true;
      group.add(cradleMesh);

      const hp = gltf.scene;
      hp.scale.set(0.046, 0.046, 0.046);
      hp.position.set(0, 0.27, 0);
      setupShadows(hp);
      group.add(hp);

      scene.add(group);
      checkAllLoaded();
    });

    // 3. Sketchbook on Coffee Table
    loader.load('/models/props/sketchbook.glb', (gltf) => {
      const group = new THREE.Group();
      group.name = 'Sketchbook';
      group.position.set(0.60, 0.56, 1.30);
      group.rotation.set(0, (25 * Math.PI) / 180, 0);

      const sb = gltf.scene;
      sb.scale.set(0.00039, 0.00052, 0.00042);
      sb.position.set(0.030, 0.0025, -0.127);
      setupShadows(sb);
      group.add(sb);

      scene.add(group);
      checkAllLoaded();
    });

    // 4. Football (Boots + Ball)
    loader.load('/models/props/football.glb', (gltf) => {
      const group = new THREE.Group();
      group.name = 'Football';

      const bootsGroup = new THREE.Group();
      bootsGroup.position.set(1.75, 0.20, -2.35);
      bootsGroup.rotation.set(0, (-35 * Math.PI) / 180, 0);

      const boots = gltf.scene;
      boots.scale.set(1.10, 1.10, 1.10);
      boots.position.set(0.03, 0.023, -0.078);
      setupShadows(boots);
      bootsGroup.add(boots);
      group.add(bootsGroup);

      const ballRadius = 0.175;
      const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({
        map: createFootballTexture(),
        roughness: 0.35,
        metalness: 0.05
      });
      const ballMesh = new THREE.Mesh(ballGeo, ballMat);
      ballMesh.position.set(2.30, 0.20 + ballRadius, -2.20);
      ballMesh.castShadow = true;
      ballMesh.receiveShadow = true;
      group.add(ballMesh);

      scene.add(group);
      checkAllLoaded();
    });

    // If headless / screenshot capture, render once when loaded and stop rAF
    const isHeadless = navigator.webdriver || urlParams.has('headless');
    if (!isHeadless) {
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
